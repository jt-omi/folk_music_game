<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="0; url=./sichuan-music-game.html">
  <title>音符旅行家：四川民族音乐游戏</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #4c2a19;
      background: linear-gradient(135deg, #fff3cf, #dff2ec);
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      width: min(520px, 92vw);
      padding: 28px 22px;
      border-radius: 26px;
      background: rgba(255, 250, 240, .94);
      border: 3px solid #d49a45;
      box-shadow: 0 18px 46px rgba(73, 45, 22, .18);
    }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 6vw, 38px); }
    p { margin: 0 0 18px; line-height: 1.8; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(145deg, #e09c34, #b64032);
      text-decoration: none;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(127, 47, 42, .24);
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>音符旅行家</h1>
      <p>正在进入“四川民族音乐游戏”。如果没有自动跳转，请点击下面按钮。</p>
      <a href="./sichuan-music-game.html">进入游戏</a>
    </section>
  </main>
</body>
</html>
